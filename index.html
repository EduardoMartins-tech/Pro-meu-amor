    <title>Dia dos Namorados</title>
    <script>
      // Workaround for external scripts/extensions trying to polyfill fetch in an environment
      // where it's already defined with only a getter (e.g. AI Studio preview iframe).
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { console.warn('Ignored attempt to overwrite window.fetch'); },
            configurable: true
          });
        }
      } catch (e) {
        // Ignore errors if it's already non-configurable
      }
    </script>
